<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Atendimento de TI</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <main class="container">
    <h1>Atendimento de TI</h1>
    <p>Descreva sua dúvida ou problema técnico.</p>

    <form method="post" action="/api/chat">
      <label for="message">Sua mensagem</label>
      <textarea id="message" name="message" required>{{ message or "" }}</textarea>
      <button type="submit">Enviar mensagem</button>
    </form>

    {% if answer %}
      <section class="result">
        <h2>Resposta do assistente</h2>
        <p>{{ answer }}</p>
      </section>
    {% endif %}

    {% if error %}
      <section class="error">
        <p>{{ error }}</p>
      </section>
    {% endif %}

    <p><a href="/">Voltar ao início</a></p>
  </main>
</body>
</html>
